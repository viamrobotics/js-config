name: Main

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Install 🔧'
        uses: ./.github/actions/setup

      - name: 'Run checks ✅'
        run: pnpm run all

  publish:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: 'Install 🔧'
        uses: ./.github/actions/setup
        with:
          node-version: '24'

      - name: 'Build 🏗️'
        run: pnpm run build

      - name: 'Publish 🚀'
        run: |
          for pkg_dir in packages/*/; do
            (
              cd "$pkg_dir"
              name=$(node -p "require('./package.json').name")
              version=$(node -p "require('./package.json').version")
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "::notice::Skipping $name@$version (already published)"
                exit 0
              fi
              echo "::group::Publishing $name@$version"
              pnpm pack
              tarball=$(ls -1t *.tgz | head -1)
              npm publish "$tarball" --provenance --access public
              echo "::endgroup::"
            )
          done
