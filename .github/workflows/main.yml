name: Main

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Install 🔧'
        uses: ./.github/actions/setup

      - name: 'Run checks ✅'
        run: pnpm run all

  publish:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: 'Install 🔧'
        uses: ./.github/actions/setup
        with:
          node-version: '24'

      - name: 'Build 🏗️'
        run: pnpm run build

      - name: 'Publish 🚀'
        run: pnpm publish --recursive --no-git-checks
