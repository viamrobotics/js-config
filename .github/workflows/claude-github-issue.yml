name: Claude GitHub Issue

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  call-github-issue:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    if: >-
      github.repository_owner == 'viamrobotics' && (
        (
          github.event_name == 'issues' &&
          contains(github.event.issue.body, '@claude') &&
          (
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
            github.event.issue.user.login == 'github-actions[bot]' ||
            github.event.issue.user.login == 'claude[bot]'
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    # viamrobotics/claude-ci-workflows@v2.0.0
    uses: viamrobotics/claude-ci-workflows/.github/workflows/claude-github-issue.yml@aa76787c145ed43f8f7b9bae4d978da4f9850001
    with:
      issue_number: ${{ github.event.issue.number }}
      title: ${{ github.event.issue.title }}
      body: ${{ github.event.issue.body }}
      issue_author: ${{ github.event.issue.user.login }}
      install_command: |
        NODE22_BIN=$(ls -d /opt/hostedtoolcache/node/22.*/x64/bin | tail -1)
        echo "$NODE22_BIN" >> "$GITHUB_PATH"
        export PATH="$NODE22_BIN:$PATH"
        corepack enable
        pnpm install
      task_complexity: small
      allowed_tools:
        'Edit,Read,Write,Glob,Grep,Bash(pnpm *),Bash(npx *),Bash(node
        *),Bash(ls *),Bash(find *),Bash(git config *),Bash(git add *),Bash(git
        commit *),Bash(git push *),Bash(git status*),Bash(git diff*),Bash(git
        log*),Bash(git checkout *),Bash(git branch *),Bash(git rev-parse
        *),Bash(git fetch *),Bash(gh pr create*),Bash(gh pr edit*),Bash(gh pr
        view*),Bash(gh pr diff*),Bash(gh issue comment*),Bash(gh issue view*),Bash(gh run view*),Bash(gh run list*)'
      extra_prompt: |
        - If the issue is unclear, missing critical detail, or you need a decision from the reporter before you can proceed, DO NOT open a PR. Instead, post ONE comment on the issue using `gh issue comment ${{ github.event.issue.number }}` that:
          - Opens by tagging the reporter with `@${{ github.event.issue.user.login }}`
          - Lists your specific questions as a bullet list (be concrete: which file, which behavior, which edge case)
          - States that you will resume once they reply with the needed info
          Then exit successfully without creating a branch or PR.
        - Otherwise, implement the issue following the standard flow: branch `claude/<short-desc>`, commit, push, open a PR with `Closes #${{ github.event.issue.number }}` in the body.
        - If the change only affects a single package under `packages/`, mention
          that package's name in the PR title (e.g.
          `feat(eslint-config): add new rule for …`).
        - Releases are manual — do NOT bump `version` in any package.json unless the
          issue explicitly asks for it.
        - Only run verification commands relevant to the files you changed:
          - TypeScript / JS files (.ts, .js): `pnpm lint` and `pnpm test`
          - Build regressions: `pnpm build`
          - Or run everything at once: `pnpm run all`
        - Before editing code, read 1-2 similar functions or modules in the same package to follow existing patterns and conventions.
        - When editing files under `packages/eslint-config-svelte/` or `packages/prettier-config-svelte/`, consult the Svelte MCP server to ensure rules and formatting behave correctly with Svelte 5 runes.
      extra_system_prompt: >-
        This is the `@viamrobotics/js-config` pnpm workspace monorepo. It publishes
        six shared configuration packages under `packages/`:
        `@viamrobotics/eslint-config`, `@viamrobotics/eslint-config-svelte`,
        `@viamrobotics/prettier-config`, `@viamrobotics/prettier-config-svelte`,
        `@viamrobotics/tailwind-config`, `@viamrobotics/typescript-config`.
        Each package is consumed by other Viam repos via its `peerDependencies`
        ranges, so widening peer ranges is a breaking-change decision.
        Verify with `pnpm lint`, `pnpm test`, and `pnpm build` (which runs `tsc -b`).
        Do NOT modify `packages/*/dist/**` (generated) or `pnpm-lock.yaml`
        (regenerated by pnpm). This repo does NOT use changesets; releases are
        manual `version` bumps in the relevant `package.json` files.
        Package manager: pnpm. Node: 22.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_AI_WORKFLOW_ALERT_WEBHOOK_URL }}
